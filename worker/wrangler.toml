name = "ukiyo-e-worker"
main = "src/index.ts"
compatibility_date = "2024-12-18"

routes = [
  { pattern = "api-ukiyo.openclawd.co/*", zone_name = "openclawd.co" }
]

[vars]
ENVIRONMENT = "production"
# SPEC-163: LLM API Gateway。仅 URL，访问凭证走 LLM_SERVICE_TOKEN secret。
LLM_GATEWAY_URL = "https://api-llm.openclawd.co"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "1f3380fd6d704fe5a12e73e37d159c4a"

[durable_objects]
bindings = [
  { name = "GENERATION_QUEUE", class_name = "GenerationQueue" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GenerationQueue"]

# Secrets (set via `wrangler secret put`):
# - LLM_SERVICE_TOKEN   (SPEC-163; 值：SERVICE_TOKEN_UKIYO_E / cindy deploy 时写入)
# 旧 secret（保留 30 天 rollback 窗后删除）：
# - DASHSCOPE_API_KEY
